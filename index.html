<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound News - Leitor de Música</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #ffffff;
            --secondary-color: #b3b3b3;
            --accent-color: #1db954;
            --player-bg: #181818;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            padding-bottom: 90px;
        }

        header {
            padding: 20px;
            text-align: center;
            background-color: var(--card-bg);
            border-bottom: 1px solid #282828;
        }

        header h1 {
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        /* Área de Pesquisa */
        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .search-box button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background-color: var(--accent-color);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background-color: #1ed760;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .section-title {
            margin: 20px 0 10px 0;
            font-size: 1.2rem;
            color: var(--secondary-color);
        }

        /* Lista de Músicas */
        .lista-musicas {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-musica {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .card-musica:hover {
            background-color: #282828;
        }

        .card-musica.tocando {
            border-left: 4px solid var(--accent-color);
        }

        .card-musica.tocando .titulo-musica {
            color: var(--accent-color);
        }

        .info-musica h4 {
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .info-musica p {
            font-size: 0.85rem;
            color: var(--secondary-color);
        }

        .origem-tag {
            font-size: 0.75rem;
            background-color: #333;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            color: #ccc;
        }

        /* Mini Player Fixo */
        .mini-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: var(--player-bg);
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            width: 30%;
        }

        .player-info .titulo {
            font-size: 0.95rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-info .artista {
            font-size: 0.8rem;
            color: var(--secondary-color);
        }

        /* Controles do Player */
        .player-controles {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-controle {
            background: none;
            border: none;
            color: var(--secondary-color);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }

        .btn-controle:hover {
            color: var(--primary-color);
        }

        .btn-controle.ativo {
            color: var(--accent-color);
            position: relative;
        }

        .btn-controle.ativo::after {
            content: '•';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
        }

        .btn-play {
            font-size: 1.8rem;
            color: var(--primary-color);
        }

        .btn-play:hover {
            color: var(--accent-color);
        }

        /* Elemento de Áudio Escondido */
        audio {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sound News</h1>
        <div class="search-box">
            <input type="text" id="input-busca" placeholder="Pesquisar artista ou tema..." onkeyup="tratarEnter(event)">
            <button onclick="executarPesquisa()">Buscar</button>
        </div>
    </header>

    <div class="container">
        <h3 class="section-title" id="titulo-resultados">Músicas Disponíveis</h3>
        <div class="lista-musicas" id="lista-musicas">
            <!-- As músicas serão carregadas aqui -->
        </div>
    </div>

    <!-- Leitor de Áudio HTML5 -->
    <audio id="audio-player"></audio>

    <!-- Mini Player Fixo -->
    <div class="mini-player">
        <div class="player-info">
            <span class="titulo" id="player-titulo">Selecione uma música</span>
            <span class="artista" id="player-artista">-</span>
        </div>

        <div class="player-controles">
            <button class="btn-controle" id="btn-shuffle" onclick="toggleShuffle()" title="Modo Aleatório">🔀</button>
            <button class="btn-controle" onclick="mudarMusica(-1)" title="Anterior">⏮️</button>
            <button class="btn-controle btn-play" id="btn-play" onclick="togglePlay()" title="Reproduzir/Pausar">▶️</button>
            <button class="btn-controle" onclick="mudarMusica(1)" title="Avançar">⏭️</button>
            <button class="btn-controle" id="btn-repeat" onclick="toggleRepeat()" title="Repetir Faixa">🔁</button>
        </div>
    </div>

    <script>
        // Músicas Locais do Sound News
        const musicasLocais = [
            { titulo: "Bohemian Rhapsody", artista: "Queen", url: "", origem: "Sound News" },
            { titulo: "Hotel California", artista: "Eagles", url: "", origem: "Sound News" },
            { titulo: "Imagine", artista: "John Lennon", url: "", origem: "Sound News" },
            { titulo: "Smells Like Teen Spirit", artista: "Nirvana", url: "", origem: "Sound News" },
            { titulo: "Billie Jean", artista: "Michael Jackson", url: "", origem: "Sound News" }
        ];

        // Lista ativa (combina locais e resultados da busca exterior)
        let listaExibida = [...musicasLocais];

        // Estados do Player
        let indexAtual = -1;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;

        // Elementos do DOM
        const audio = document.getElementById('audio-player');
        const containerLista = document.getElementById('lista-musicas');
        const playerTitulo = document.getElementById('player-titulo');
        const playerArtista = document.getElementById('player-artista');
        const btnPlay = document.getElementById('btn-play');
        const btnShuffle = document.getElementById('btn-shuffle');
        const btnRepeat = document.getElementById('btn-repeat');
        const tituloResultados = document.getElementById('titulo-resultados');

        // Renderizar Lista
        function renderizarLista(lista) {
            containerLista.innerHTML = '';
            if (lista.length === 0) {
                containerLista.innerHTML = '<p style="color: var(--secondary-color); text-align: center;">Nenhuma música encontrada.</p>';
                return;
            }

            lista.forEach((musica, index) => {
                const card = document.createElement('div');
                card.className = `card-musica ${index === indexAtual ? 'tocando' : ''}`;
                card.onclick = () => selecionarMusica(index);
                card.innerHTML = `
                    <div class="info-musica">
                        <h4 class="titulo-musica">${musica.titulo} <span class="origem-tag">${musica.origem}</span></h4>
                        <p>${musica.artista}</p>
                    </div>
                    <span style="color: var(--accent-color); font-size: 1.2rem;">▶</span>
                `;
                containerLista.appendChild(card);
            });
        }

        // Executar Pesquisa (Sound News + Externa)
        async function executarPesquisa() {
            const termo = document.getElementById('input-busca').value.trim().toLowerCase();

            if (!termo) {
                listaExibida = [...musicasLocais];
                tituloResultados.innerText = "Músicas Disponíveis";
                renderizarLista(listaExibida);
                return;
            }

            tituloResultados.innerText = `A pesquisar "${termo}"...`;

            // 1. Filtrar no catálogo Sound News
            const resultadosLocais = musicasLocais.filter(m => 
                m.titulo.toLowerCase().includes(termo) || 
                m.artista.toLowerCase().includes(termo)
            );

            // 2. Pesquisar na Web/Exterior (iTunes API Externa)
            let resultadosExternos = [];
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(termo)}&media=music&limit=10`);
                const data = await response.json();
                
                resultadosExternos = data.results.map(item => ({
                    titulo: item.trackName,
                    artista: item.artistName,
                    url: item.previewUrl, // Áudio de prévia de 30 segundos
                    origem: "Exterior (Web)"
                }));
            } catch (erro) {
                console.error("Erro ao buscar músicas externas:", erro);
            }

            // Junta os dois resultados
            listaExibida = [...resultadosLocais, ...resultadosExternos];
            tituloResultados.innerText = `Resultados para "${termo}" (${listaExibida.length})`;
            indexAtual = -1;
            renderizarLista(listaExibida);
        }

        function tratarEnter(e) {
            if (e.key === 'Enter') {
                executarPesquisa();
            }
        }

        // Selecionar e Tocar
        function selecionarMusica(index) {
            indexAtual = index;
            const musica = listaExibida[indexAtual];

            playerTitulo.innerText = musica.titulo;
            playerArtista.innerText = musica.artista;

            if (musica.url) {
                audio.src = musica.url;
                audio.play();
                isPlaying = true;
            } else {
                // Caso seja uma música do catálogo local sem link de áudio direto
                audio.pause();
                isPlaying = false;
                alert(`Tocando "${musica.titulo}" do catálogo Sound News.`);
            }

            atualizarPlayer();
            renderizarLista(listaExibida);
        }

        // Controles de Play / Pause
        function togglePlay() {
            if (indexAtual === -1 && listaExibida.length > 0) {
                selecionarMusica(0);
                return;
            }

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                if (audio.src) audio.play();
                isPlaying = true;
            }
            atualizarPlayer();
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            btnShuffle.classList.toggle('ativo', isShuffle);
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            btnRepeat.classList.toggle('ativo', isRepeat);
        }

        function mudarMusica(direcao) {
            if (listaExibida.length === 0) return;

            if (indexAtual === -1) {
                selecionarMusica(0);
                return;
            }

            if (direcao === 1) {
                if (isRepeat) {
                    indexAtual = indexAtual;
                } else if (isShuffle) {
                    let novoIndex;
                    do {
                        novoIndex = Math.floor(Math.random() * listaExibida.length);
                    } while (novoIndex === indexAtual && listaExibida.length > 1);
                    indexAtual = novoIndex;
                } else {
                    indexAtual = (indexAtual + 1) % listaExibida.length;
                }
            } else if (direcao === -1) {
                indexAtual = (indexAtual - 1 + listaExibida.length) % listaExibida.length;
            }

            selecionarMusica(indexAtual);
        }

        function atualizarPlayer() {
            btnPlay.innerText = isPlaying ? '⏸️' : '▶️';
        }

        // Evento automático quando a música termina
        audio.onended = () => {
            mudarMusica(1);
        };

        // Inicialização
        renderizarLista(listaExibida);
    </script>
</body>
</html>
