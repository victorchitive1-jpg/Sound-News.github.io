<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound News - Streaming, Ranking & Equalizador</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #181b26;
            --primary-color: #ffffff;
            --secondary-color: #a0a5b5;
            --accent-color: #1db954;
            --player-bg: #12141d;
            --radio-active: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            padding-bottom: 110px;
        }

        header {
            padding: 20px 15px;
            background-color: var(--card-bg);
            border-bottom: 1px solid #25293a;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 800px;
            margin: 0 auto 15px auto;
        }

        .logo-area h1 {
            font-size: 1.6rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Botão Rádio */
        .btn-radio-icon {
            background: #232736;
            border: 1px solid #32374d;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-radio-icon.aovivo {
            background-color: var(--radio-active);
            border-color: var(--radio-active);
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
            animation: pulseira 1.5s infinite;
        }

        @keyframes pulseira {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        /* Botão Admin */
        .admin-bar {
            text-align: center;
            margin-bottom: 15px;
        }

        .btn-admin {
            background-color: #232736;
            color: var(--secondary-color);
            border: 1px solid #32374d;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-admin:hover {
            color: #fff;
            border-color: var(--accent-color);
        }

        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #32374d;
            background-color: #0f111a;
            color: #fff;
            outline: none;
        }

        .search-box button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background-color: var(--accent-color);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Destaque / Capa Principal */
        .banner-capa {
            position: relative;
            width: 100%;
            height: 220px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            background-color: #232736;
            display: flex;
            align-items: flex-end;
            background-size: cover;
            background-position: center;
        }

        .banner-capa::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(15, 17, 26, 0.95), transparent);
        }

        .banner-info {
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        .banner-tag {
            background-color: var(--accent-color);
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .banner-titulo {
            font-size: 1.5rem;
            margin: 5px 0 2px 0;
        }

        .banner-artista {
            color: var(--secondary-color);
            font-size: 0.9rem;
        }

        /* Lista de Músicas */
        .section-title {
            margin: 20px 0 12px 0;
            color: var(--secondary-color);
            font-size: 1.1rem;
        }

        .lista-musicas {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-musica {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .card-musica:hover {
            background-color: #202433;
        }

        .card-musica.tocando {
            border-left: 4px solid var(--accent-color);
        }

        .card-esquerda {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex-grow: 1;
        }

        .img-capa-thumb {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            background-color: #232736;
        }

        .genero-tag {
            font-size: 0.7rem;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
        }

        .acoes-card {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-acao {
            background: none;
            border: none;
            color: var(--secondary-color);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
        }

        .btn-acao:hover {
            color: var(--accent-color);
        }

        /* Mini Player */
        .mini-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: var(--player-bg);
            border-top: 1px solid #25293a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 35%;
        }

        .player-capa {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
            background-color: #232736;
        }

        .player-textos {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .player-textos .titulo {
            font-weight: bold;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-textos .artista {
            color: var(--secondary-color);
            font-size: 0.8rem;
        }

        .player-controles {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-controle {
            background: none;
            border: none;
            color: var(--secondary-color);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .btn-controle.ativo {
            color: var(--accent-color);
        }

        .btn-play {
            font-size: 1.8rem;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo-area">
                <h1>🎵 Sound News</h1>
            </div>
            <button class="btn-radio-icon" id="btn-radio" onclick="toggleRadio()" title="Ligar/Desligar Rádio Sound News">📻</button>
        </div>

        <!-- Botão Painel de Gestão (Admin) -->
        <div class="admin-bar">
            <button class="btn-admin" onclick="abrirAdmin()">⚙️ Painel de Gestão (Admin)</button>
        </div>

        <div class="search-box">
            <input type="text" id="input-busca" placeholder="Pesquisar artista, género..." onkeyup="tratarEnter(event)">
            <button onclick="executarPesquisa()">Buscar</button>
        </div>
    </header>

    <div class="container">
        <!-- Capa / Banner da Música em Destaque -->
        <div class="banner-capa" id="banner-capa" style="background-image: url('capa.jpg');">
            <div class="banner-info">
                <span class="banner-tag" id="banner-tag">Destaque</span>
                <h2 class="banner-titulo" id="banner-titulo">Selecione uma Música</h2>
                <p class="banner-artista" id="banner-artista">Sound News Streaming</p>
            </div>
        </div>

        <h3 class="section-title" id="titulo-resultados">Músicas Disponíveis</h3>
        <div class="lista-musicas" id="lista-musicas"></div>
    </div>

    <!-- Leitores de Áudio -->
    <audio id="audio-player"></audio>
    <audio id="radio-player" src="https://stream.zeno.fm/f3wvbbqmdg8uv"></audio>

    <!-- Mini Player Fixo -->
    <div class="mini-player">
        <div class="player-info">
            <img src="capa.jpg" id="player-img" class="player-capa" alt="Capa">
            <div class="player-textos">
                <span class="titulo" id="player-titulo">Selecione uma música</span>
                <span class="artista" id="player-artista">-</span>
            </div>
        </div>

        <div class="player-controles">
            <button class="btn-controle" id="btn-shuffle" onclick="toggleShuffle()">🔀</button>
            <button class="btn-controle" onclick="mudarMusica(-1)">⏮️</button>
            <button class="btn-controle btn-play" id="btn-play" onclick="togglePlay()">▶️</button>
            <button class="btn-controle" onclick="mudarMusica(1)">⏭️</button>
            <button class="btn-controle" id="btn-repeat" onclick="toggleRepeat()">🔁</button>
            <a class="btn-acao" id="btn-download-player" href="#" download title="Baixar Música" style="display: none;">⬇️</a>
        </div>
    </div>

    <script>
        let musicas = [];
        let listaExibida = [];
        let indexAtual = -1;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;
        let isRadioPlaying = false;

        const audio = document.getElementById('audio-player');
        const radioAudio = document.getElementById('radio-player');
        const btnRadio = document.getElementById('btn-radio');
        const containerLista = document.getElementById('lista-musicas');
        const btnPlay = document.getElementById('btn-play');
        const btnDownloadPlayer = document.getElementById('btn-download-player');

        // Abre a página admin.html diretamente ao clicar no botão
        function abrirAdmin() {
            window.location.href = "admin.html";
        }

        // Alternar Rádio
        function toggleRadio() {
            if (isRadioPlaying) {
                radioAudio.pause();
                isRadioPlaying = false;
                btnRadio.classList.remove('aovivo');
                btnRadio.innerText = '📻';
                
                document.getElementById('player-titulo').innerText = "Selecione uma música";
                document.getElementById('player-artista').innerText = "-";
            } else {
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    btnPlay.innerText = '▶️';
                }

                radioAudio.play().catch(e => console.log("Erro ao tocar rádio:", e));
                isRadioPlaying = true;
                btnRadio.classList.add('aovivo');
                btnRadio.innerText = '📻';

                document.getElementById('player-titulo').innerText = "Rádio Sound News FM";
                document.getElementById('player-artista').innerText = "Transmissão AO VIVO";
                document.getElementById('player-img').src = "capa.jpg";
                btnDownloadPlayer.style.display = 'none';
            }
        }

        // Carregar do musicas.json
        async function carregarMusicas() {
            try {
                const res = await fetch('musicas.json');
                musicas = await res.json();
                listaExibida = [...musicas];
                renderizarLista(listaExibida);

                // Define a primeira música como destaque na Capa
                if (musicas.length > 0) {
                    atualizarCapa(musicas[0]);
                }
            } catch (err) {
                console.error("Erro ao carregar musicas.json:", err);
            }
        }

        function atualizarCapa(m) {
            const fotoCapa = m.capa || 'capa.jpg';
            document.getElementById('banner-capa').style.backgroundImage = `url('${fotoCapa}')`;
            document.getElementById('banner-titulo').innerText = m.titulo;
            document.getElementById('banner-artista').innerText = m.artista;
            document.getElementById('banner-tag').innerText = m.genero || 'Destaque';
        }

        function renderizarLista(lista) {
            containerLista.innerHTML = '';
            lista.forEach((musica, index) => {
                const foto = musica.capa || 'capa.jpg';
                const card = document.createElement('div');
                card.className = `card-musica ${index === indexAtual && !isRadioPlaying ? 'tocando' : ''}`;
                card.innerHTML = `
                    <div class="card-esquerda" onclick="selecionarMusica(${index})">
                        <img src="${foto}" class="img-capa-thumb" alt="Capa">
                        <div>
                            <h4>${musica.titulo} <span class="genero-tag">${musica.genero || 'Single'}</span></h4>
                            <p style="color: var(--secondary-color); font-size: 0.85rem;">${musica.artista}</p>
                        </div>
                    </div>
                    <div class="acoes-card">
                        <button class="btn-acao" onclick="selecionarMusica(${index})" title="Ouvir">▶</button>
                        <a class="btn-acao" href="${musica.audio}" download="${musica.downloadNome || musica.titulo + '.mp3'}" title="Baixar">⬇️</a>
                    </div>
                `;
                containerLista.appendChild(card);
            });
        }

        function selecionarMusica(index) {
            if (isRadioPlaying) {
                toggleRadio();
            }

            indexAtual = index;
            const m = listaExibida[indexAtual];

            atualizarCapa(m);

            document.getElementById('player-titulo').innerText = m.titulo;
            document.getElementById('player-artista').innerText = m.artista;
            document.getElementById('player-img').src = m.capa || 'capa.jpg';

            audio.src = m.audio;
            audio.play();
            isPlaying = true;

            btnDownloadPlayer.href = m.audio;
            btnDownloadPlayer.download = m.downloadNome || `${m.titulo}.mp3`;
            btnDownloadPlayer.style.display = 'inline';

            btnPlay.innerText = '⏸️';
            renderizarLista(listaExibida);
        }

        function togglePlay() {
            if (isRadioPlaying) {
                toggleRadio();
                return;
            }

            if (indexAtual === -1 && listaExibida.length > 0) {
                selecionarMusica(0);
                return;
            }
            if (isPlaying) {
                audio.pause();
                btnPlay.innerText = '▶️';
            } else {
                audio.play();
                btnPlay.innerText = '⏸️';
            }
            isPlaying = !isPlaying;
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('btn-shuffle').classList.toggle('ativo', isShuffle);
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('btn-repeat').classList.toggle('ativo', isRepeat);
        }

        function mudarMusica(dir) {
            if (listaExibida.length === 0 || isRadioPlaying) return;
            if (isRepeat && dir === 1) {
                indexAtual = indexAtual;
            } else if (isShuffle && dir === 1) {
                indexAtual = Math.floor(Math.random() * listaExibida.length);
            } else {
                indexAtual = (indexAtual + dir + listaExibida.length) % listaExibida.length;
            }
            selecionarMusica(indexAtual);
        }

        function executarPesquisa() {
            const termo = document.getElementById('input-busca').value.toLowerCase();
            listaExibida = musicas.filter(m => 
                m.titulo.toLowerCase().includes(termo) || 
                m.artista.toLowerCase().includes(termo) ||
                (m.genero && m.genero.toLowerCase().includes(termo))
            );
            renderizarLista(listaExibida);
        }

        function tratarEnter(e) {
            if (e.key === 'Enter') executarPesquisa();
        }

        audio.onended = () => mudarMusica(1);

        carregarMusicas();
    </script>
</body>
</html>
