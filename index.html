<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound News - Leitor de Música</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #ffffff;
            --secondary-color: #b3b3b3;
            --accent-color: #1db954;
            --player-bg: #181818;
            --radio-active: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            padding-bottom: 100px;
        }

        header {
            padding: 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid #282828;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 800px;
            margin: 0 auto;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Botão do Ícone da Rádio */
        .btn-radio-icon {
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #fff;
        }

        .btn-radio-icon:hover {
            transform: scale(1.08);
            border-color: var(--accent-color);
        }

        /* Animação quando a rádio está AOVIVO */
        .btn-radio-icon.aovivo {
            background-color: var(--radio-active);
            border-color: var(--radio-active);
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
            animation: pulseira 1.5s infinite;
        }

        @keyframes pulseira {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            max-width: 800px;
            margin: 15px auto 0;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
        }

        .search-box button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background-color: var(--accent-color);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .section-title {
            margin: 20px 0 10px 0;
            color: var(--secondary-color);
        }

        .lista-musicas {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-musica {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            padding: 12px 20px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .card-musica:hover {
            background-color: #282828;
        }

        .card-musica.tocando {
            border-left: 4px solid var(--accent-color);
        }

        .info-musica {
            cursor: pointer;
            flex-grow: 1;
        }

        .genero-tag {
            font-size: 0.75rem;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
        }

        .acoes-card {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-acao {
            background: none;
            border: none;
            color: var(--secondary-color);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
        }

        .btn-acao:hover {
            color: var(--accent-color);
        }

        /* Mini Player */
        .mini-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: var(--player-bg);
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            width: 30%;
        }

        .player-controles {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-controle {
            background: none;
            border: none;
            color: var(--secondary-color);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .btn-controle.ativo {
            color: var(--accent-color);
        }

        .btn-play {
            font-size: 1.8rem;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo-area">
                <h1>🎵 Sound News</h1>
            </div>
            <!-- Ícone Clicável da Rádio (Sem texto) -->
            <button class="btn-radio-icon" id="btn-radio" onclick="toggleRadio()" title="Ligar/Desligar Rádio Sound News">📻</button>
        </div>

        <div class="search-box">
            <input type="text" id="input-busca" placeholder="Pesquisar artista, género..." onkeyup="tratarEnter(event)">
            <button onclick="executarPesquisa()">Buscar</button>
        </div>
    </header>

    <div class="container">
        <h3 class="section-title" id="titulo-resultados">Músicas Disponíveis</h3>
        <div class="lista-musicas" id="lista-musicas"></div>
    </div>

    <!-- Leitor de Áudio Principal -->
    <audio id="audio-player"></audio>
    <!-- Stream de Áudio da Rádio -->
    <audio id="radio-player" src="https://stream.zeno.fm/f3wvbbqmdg8uv"></audio>

    <!-- Mini Player -->
    <div class="mini-player">
        <div class="player-info">
            <span id="player-titulo" style="font-weight: bold;">Selecione uma música</span>
            <span id="player-artista" style="color: var(--secondary-color); font-size: 0.85rem;">-</span>
        </div>

        <div class="player-controles">
            <button class="btn-controle" id="btn-shuffle" onclick="toggleShuffle()">🔀</button>
            <button class="btn-controle" onclick="mudarMusica(-1)">⏮️</button>
            <button class="btn-controle btn-play" id="btn-play" onclick="togglePlay()">▶️</button>
            <button class="btn-controle" onclick="mudarMusica(1)">⏭️</button>
            <button class="btn-controle" id="btn-repeat" onclick="toggleRepeat()">🔁</button>
            <a class="btn-acao" id="btn-download-player" href="#" download title="Baixar Música" style="display: none;">⬇️</a>
        </div>
    </div>

    <script>
        let musicas = [];
        let listaExibida = [];
        let indexAtual = -1;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;
        let isRadioPlaying = false;

        const audio = document.getElementById('audio-player');
        const radioAudio = document.getElementById('radio-player');
        const btnRadio = document.getElementById('btn-radio');
        const containerLista = document.getElementById('lista-musicas');
        const btnPlay = document.getElementById('btn-play');
        const btnDownloadPlayer = document.getElementById('btn-download-player');

        // Alternar Rádio (Ligar / Desligar)
        function toggleRadio() {
            if (isRadioPlaying) {
                // Desligar Rádio
                radioAudio.pause();
                isRadioPlaying = false;
                btnRadio.classList.remove('aovivo');
                btnRadio.innerText = '📻';
                
                document.getElementById('player-titulo').innerText = "Selecione uma música";
                document.getElementById('player-artista').innerText = "-";
            } else {
                // Parar leitor normal se estiver tocando
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    btnPlay.innerText = '▶️';
                }

                // Ligar Rádio
                radioAudio.play().catch(e => console.log("Erro ao tocar rádio:", e));
                isRadioPlaying = true;
                btnRadio.classList.add('aovivo');
                btnRadio.innerText = '📻';

                document.getElementById('player-titulo').innerText = "Rádio Sound News FM";
                document.getElementById('player-artista').innerText = "Transmissão AO VIVO";
                btnDownloadPlayer.style.display = 'none';
            }
        }

        // Carregar músicas do JSON
        async function carregarMusicas() {
            try {
                const res = await fetch('musicas.json');
                musicas = await res.json();
                listaExibida = [...musicas];
                renderizarLista(listaExibida);
            } catch (err) {
                console.error("Erro ao carregar musicas.json:", err);
            }
        }

        function renderizarLista(lista) {
            containerLista.innerHTML = '';
            lista.forEach((musica, index) => {
                const card = document.createElement('div');
                card.className = `card-musica ${index === indexAtual && !isRadioPlaying ? 'tocando' : ''}`;
                card.innerHTML = `
                    <div class="info-musica" onclick="selecionarMusica(${index})">
                        <h4>${musica.titulo} <span class="genero-tag">${musica.genero || 'Single'}</span></h4>
                        <p style="color: var(--secondary-color); font-size: 0.85rem;">${musica.artista}</p>
                    </div>
                    <div class="acoes-card">
                        <button class="btn-acao" onclick="selecionarMusica(${index})" title="Ouvir">▶</button>
                        <a class="btn-acao" href="${musica.audio}" download="${musica.downloadNome || musica.titulo + '.mp3'}" title="Baixar">⬇️</a>
                    </div>
                `;
                containerLista.appendChild(card);
            });
        }

        function selecionarMusica(index) {
            // Se a rádio estiver ligada, desliga
            if (isRadioPlaying) {
                toggleRadio();
            }

            indexAtual = index;
            const m = listaExibida[indexAtual];

            document.getElementById('player-titulo').innerText = m.titulo;
            document.getElementById('player-artista').innerText = m.artista;

            audio.src = m.audio;
            audio.play();
            isPlaying = true;

            btnDownloadPlayer.href = m.audio;
            btnDownloadPlayer.download = m.downloadNome || `${m.titulo}.mp3`;
            btnDownloadPlayer.style.display = 'inline';

            btnPlay.innerText = '⏸️';
            renderizarLista(listaExibida);
        }

        function togglePlay() {
            if (isRadioPlaying) {
                toggleRadio();
                return;
            }

            if (indexAtual === -1 && listaExibida.length > 0) {
                selecionarMusica(0);
                return;
            }
            if (isPlaying) {
                audio.pause();
                btnPlay.innerText = '▶️';
            } else {
                audio.play();
                btnPlay.innerText = '⏸️';
            }
            isPlaying = !isPlaying;
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('btn-shuffle').classList.toggle('ativo', isShuffle);
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('btn-repeat').classList.toggle('ativo', isRepeat);
        }

        function mudarMusica(dir) {
            if (listaExibida.length === 0 || isRadioPlaying) return;
            if (isRepeat && dir === 1) {
                indexAtual = indexAtual;
            } else if (isShuffle && dir === 1) {
                indexAtual = Math.floor(Math.random() * listaExibida.length);
            } else {
                indexAtual = (indexAtual + dir + listaExibida.length) % listaExibida.length;
            }
            selecionarMusica(indexAtual);
        }

        function executarPesquisa() {
            const termo = document.getElementById('input-busca').value.toLowerCase();
            listaExibida = musicas.filter(m => 
                m.titulo.toLowerCase().includes(termo) || 
                m.artista.toLowerCase().includes(termo) ||
                (m.genero && m.genero.toLowerCase().includes(termo))
            );
            renderizarLista(listaExibida);
        }

        function tratarEnter(e) {
            if (e.key === 'Enter') executarPesquisa();
        }

        audio.onended = () => mudarMusica(1);

        carregarMusicas();
    </script>
</body>
</html>
