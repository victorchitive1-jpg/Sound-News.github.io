<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound News - Gerador de JSON Admin</title>

    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #181b26;
            --primary-color: #ffffff;
            --secondary-color: #a0a5b5;
            --accent-color: #1db954;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            padding: 20px 15px 60px 15px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #25293a;
        }

        h1 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-voltar {
            background-color: #232736;
            color: var(--secondary-color);
            border: 1px solid #32374d;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn-voltar:hover {
            color: #fff;
            border-color: var(--accent-color);
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #25293a;
        }

        .card-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.85rem;
            color: var(--secondary-color);
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #32374d;
            background-color: #0f111a;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .botoes-acoes {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            font-size: 0.9rem;
        }

        .btn-adicionar {
            background-color: var(--accent-color);
            color: #000;
        }

        .btn-limpar {
            background-color: #32374d;
            color: #fff;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        /* Área do JSON */
        textarea {
            width: 100%;
            height: 250px;
            background-color: #090a10;
            color: #1db954;
            border: 1px solid #32374d;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            resize: vertical;
            outline: none;
        }

        .area-copiar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn-copiar {
            background-color: #232736;
            color: #fff;
            border: 1px solid var(--accent-color);
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn-copiar:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        /* Lista de Músicas Temporárias */
        .item-lista {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f111a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #25293a;
        }

        .btn-remover {
            background: none;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚙️ Gerador de JSON (Admin)</h1>
            <a href="index.html" class="btn-voltar">← Voltar ao App</a>
        </header>

        <!-- Formulário de Cadastro -->
        <div class="card">
            <h2 class="card-title">➕ Adicionar Nova Música</h2>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="titulo">Título da Música *</label>
                    <input type="text" id="titulo" placeholder="Ex: Minha Música">
                </div>

                <div class="form-group">
                    <label for="artista">Artista / Cantor *</label>
                    <input type="text" id="artista" placeholder="Ex: Nome do Artista">
                </div>

                <div class="form-group">
                    <label for="genero">Gênero Musical</label>
                    <input type="text" id="genero" placeholder="Ex: Afrobeats, Kizomba, Rap">
                </div>

                <div class="form-group">
                    <label for="audio">Arquivo de Áudio (.mp3 ou Link) *</label>
                    <input type="text" id="audio" placeholder="Ex: musica.mp3 ou https://...">
                </div>

                <div class="form-group full-width">
                    <label for="capa">Caminho da Imagem da Capa (Opcional)</label>
                    <input type="text" id="capa" placeholder="Ex: capa.jpg (Padrão se vazio)">
                </div>
            </div>

            <div class="botoes-acoes">
                <button class="btn btn-adicionar" onclick="adicionarMusica()">➕ Adicionar à Lista</button>
                <button class="btn btn-limpar" onclick="limparTudo()">🗑️ Limpar Tudo</button>
            </div>
        </div>

        <!-- Músicas na Fila -->
        <div class="card">
            <h2 class="card-title">🎵 Músicas Adicionadas (<span id="total-count">0</span>)</h2>
            <div id="lista-preview"></div>
        </div>

        <!-- Código JSON Gerado -->
        <div class="card">
            <div class="area-copiar">
                <h2 class="card-title" style="margin-bottom: 0;">📄 Código JSON Gerado</h2>
                <button class="btn-copiar" onclick="copiarJSON()">📋 Copiar Código JSON</button>
            </div>
            <p style="color: var(--secondary-color); font-size: 0.8rem; margin-bottom: 10px;">
                Copie o conteúdo abaixo e cole dentro do seu arquivo <strong>musicas.json</strong>.
            </p>
            <textarea id="json-output" readonly></textarea>
        </div>
    </div>

    <script>
        let listaMusicas = [];

        function adicionarMusica() {
            const titulo = document.getElementById('titulo').value.trim();
            const artista = document.getElementById('artista').value.trim();
            const genero = document.getElementById('genero').value.trim();
            const audio = document.getElementById('audio').value.trim();
            let capa = document.getElementById('capa').value.trim();

            if (!titulo || !artista || !audio) {
                alert("Por favor, preencha os campos obrigatórios: Título, Artista e Arquivo de Áudio!");
                return;
            }

            if (!capa) capa = 'capa.jpg';

            const novaMusica = {
                titulo: titulo,
                artista: artista,
                genero: genero || 'Single',
                audio: audio,
                capa: capa
            };

            listaMusicas.push(novaMusica);
            atualizarTela();
            limparFormulario();
        }

        function removerMusica(index) {
            listaMusicas.splice(index, 1);
            atualizarTela();
        }

        function limparTudo() {
            if (confirm("Deseja realmente limpar toda a lista?")) {
                listaMusicas = [];
                atualizarTela();
            }
        }

        function limparFormulario() {
            document.getElementById('titulo').value = '';
            document.getElementById('artista').value = '';
            document.getElementById('genero').value = '';
            document.getElementById('audio').value = '';
            document.getElementById('capa').value = '';
        }

        function atualizarTela() {
            // Atualiza contagem
            document.getElementById('total-count').innerText = listaMusicas.length;

            // Atualiza lista visual
            const preview = document.getElementById('lista-preview');
            preview.innerHTML = '';

            if (listaMusicas.length === 0) {
                preview.innerHTML = '<p style="color: var(--secondary-color); font-size: 0.85rem;">Nenhuma música adicionada ainda.</p>';
            } else {
                listaMusicas.forEach((m, i) => {
                    const item = document.createElement('div');
                    item.className = 'item-lista';
                    item.innerHTML = `
                        <div>
                            <strong>${i + 1}. ${m.titulo}</strong> - ${m.artista} 
                            <span style="color: var(--accent-color); font-size: 0.8rem;">[${m.genero}]</span>
                        </div>
                        <button class="btn-remover" onclick="removerMusica(${i})" title="Remover">❌</button>
                    `;
                    preview.appendChild(item);
                });
            }

            // Atualiza o Textarea com o JSON formatado
            document.getElementById('json-output').value = JSON.stringify(listaMusicas, null, 4);
        }

        function copiarJSON() {
            const jsonTextarea = document.getElementById('json-output');

            if (!jsonTextarea.value || jsonTextarea.value === "[]") {
                alert("Não há código JSON para copiar. Adicione pelo menos uma música.");
                return;
            }

            jsonTextarea.select();
            jsonTextarea.setSelectionRange(0, 99999); // Para telas móbiles

            navigator.clipboard.writeText(jsonTextarea.value).then(() => {
                alert("Código JSON copiado com sucesso! Agora basta colar no seu arquivo musicas.json");
            }).catch(err => {
                alert("Erro ao copiar. Tente selecionar o texto e copiar manualmente.");
            });
        }

        // Inicializa a tela com estado limpo
        atualizarTela();
    </script>
</body>
</html>
