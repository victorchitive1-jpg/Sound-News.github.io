<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Sound News</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #181b26;
            --primary-color: #ffffff;
            --secondary-color: #a0a5b5;
            --accent-color: #1db954;
            --danger-color: #ff4757;
            --warning-color: #ffa502;
            --border-color: #25293a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            padding: 20px;
        }

        .header-admin {
            max-width: 1000px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .btn-voltar {
            background-color: var(--card-bg);
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        /* Área de Drag & Drop */
        .drop-zone {
            border: 2px dashed var(--accent-color);
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
        }

        .drop-zone.hover {
            background-color: #1e2433;
            border-color: #20e066;
        }

        .drop-zone p {
            color: var(--secondary-color);
            margin-top: 8px;
            font-size: 0.9rem;
        }

        /* Formulário Manual */
        .card-painel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .card-painel h3 {
            margin-bottom: 15px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--secondary-color);
        }

        .input-group input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #0f111a;
            color: #fff;
            outline: none;
        }

        /* Barra de Ações em Massa */
        .acoes-massa {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }
        .btn-success { background-color: var(--accent-color); color: #000; }
        .btn-danger { background-color: var(--danger-color); color: #fff; }
        .btn-warning { background-color: var(--warning-color); color: #000; }

        /* Tabela de Gerenciamento */
        .tabela-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #12141d;
            color: var(--secondary-color);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        td input[type="text"] {
            width: 100%;
            padding: 6px;
            background: #0f111a;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
        }

        .checkbox-cell {
            width: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-admin">
        <h2>⚙️ Gestão de Músicas (Sound News)</h2>
        <a href="index.html" class="btn-voltar">⬅️ Voltar ao App</a>
    </div>

    <div class="container">

        <!-- 1. Drag and Drop para Upload Rápido -->
        <div class="drop-zone" id="drop-zone">
            📁 <strong>Arraste e solte os seus ficheiros .mp3 ou Imagens de Capa aqui</strong>
            <p>ou clique para selecionar do computador</p>
            <input type="file" id="file-input" multiple accept="audio/mp3,image/*" style="display: none;">
        </div>

        <!-- 2. Formulário Adicionar / Editar Manual -->
        <div class="card-painel">
            <h3>➕ Adicionar Nova Faixa</h3>
            <form id="form-musica" onsubmit="salvarMusica(event)">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Título da Música</label>
                        <input type="text" id="add-titulo" placeholder="Ex: Minha Música" required>
                    </div>
                    <div class="input-group">
                        <label>Artista / Grupo</label>
                        <input type="text" id="add-artista" placeholder="Ex: Artista Moz" required>
                    </div>
                    <div class="input-group">
                        <label>Género</label>
                        <input type="text" id="add-genero" placeholder="Ex: Marrabenta / Pandza">
                    </div>
                    <div class="input-group">
                        <label>Caminho do Áudio (.mp3)</label>
                        <input type="text" id="add-audio" placeholder="musicas/faixa.mp3" required>
                    </div>
                    <div class="input-group">
                        <label>Caminho da Capa (Imagem)</label>
                        <input type="text" id="add-capa" placeholder="capa.jpg">
                    </div>
                </div>
                <button type="submit" class="btn btn-success">Guardar Música</button>
            </form>
        </div>

        <!-- 3. Edição e Exclusão em Massa -->
        <div>
            <div class="acoes-massa">
                <div>
                    <input type="checkbox" id="select-all" onclick="toggleSelecionarTodos(this)">
                    <label for="select-all" style="margin-left: 8px; font-weight: bold;">Selecionar Todos</label>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-warning" onclick="exportarJSON()">📥 Baixar musicas.json</button>
                    <button class="btn btn-danger" onclick="excluirSelecionados()">🗑️ Eliminar Selecionados</button>
                </div>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th class="checkbox-cell">#</th>
                            <th>Título</th>
                            <th>Artista</th>
                            <th>Género</th>
                            <th>Ficheiro Áudio</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo">
                        <!-- Linhas geradas via Javascript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let musicas = [];

        // Carregar músicas (do localStorage ou do arquivo JSON inicial)
        async function carregarMusicasAdmin() {
            const localData = localStorage.getItem('sound_news_musicas');
            if (localData) {
                musicas = JSON.parse(localData);
            } else {
                try {
                    const res = await fetch('musicas.json');
                    musicas = await res.json();
                    salvarNoLocalStorage();
                } catch (e) {
                    musicas = [];
                }
            }
            renderizarTabela();
        }

        function salvarNoLocalStorage() {
            localStorage.setItem('sound_news_musicas', JSON.stringify(musicas));
        }

        function renderizarTabela() {
            const tbody = document.getElementById('tabela-corpo');
            tbody.innerHTML = '';

            musicas.forEach((m, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="checkbox-cell">
                        <input type="checkbox" class="check-item" data-index="${index}">
                    </td>
                    <td><input type="text" value="${m.titulo}" onchange="atualizarCampo(${index}, 'titulo', this.value)"></td>
                    <td><input type="text" value="${m.artista}" onchange="atualizarCampo(${index}, 'artista', this.value)"></td>
                    <td><input type="text" value="${m.genero || ''}" onchange="atualizarCampo(${index}, 'genero', this.value)"></td>
                    <td><input type="text" value="${m.audio}" onchange="atualizarCampo(${index}, 'audio', this.value)"></td>
                    <td>
                        <button class="btn btn-danger" style="padding: 4px 8px; font-size:0.8rem;" onclick="eliminarUnico(${index})">✕</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function atualizarCampo(index, campo, valor) {
            musicas[index][campo] = valor;
            salvarNoLocalStorage();
        }

        function salvarMusica(e) {
            e.preventDefault();
            const novaMusica = {
                titulo: document.getElementById('add-titulo').value,
                artista: document.getElementById('add-artista').value,
                genero: document.getElementById('add-genero').value,
                audio: document.getElementById('add-audio').value,
                capa: document.getElementById('add-capa').value || 'capa.jpg'
            };

            musicas.push(novaMusica);
            salvarNoLocalStorage();
            renderizarTabela();
            document.getElementById('form-musica').reset();
            alert('Música adicionada com sucesso!');
        }

        function eliminarUnico(index) {
            if (confirm('Tem certeza que deseja eliminar esta música?')) {
                musicas.splice(index, 1);
                salvarNoLocalStorage();
                renderizarTabela();
            }
        }

        function toggleSelecionarTodos(master) {
            const checkboxes = document.querySelectorAll('.check-item');
            checkboxes.forEach(cb => cb.checked = master.checked);
        }

        function excluirSelecionados() {
            const checkboxes = document.querySelectorAll('.check-item:checked');
            if (checkboxes.length === 0) {
                alert('Nenhuma música selecionada!');
                return;
            }

            if (confirm(`Deseja eliminar as ${checkboxes.length} músicas selecionadas?`)) {
                const indicesParaRemover = Array.from(checkboxes).map(cb => parseInt(cb.dataset.index));
                musicas = musicas.filter((_, idx) => !indicesParaRemover.includes(idx));
                salvarNoLocalStorage();
                renderizarTabela();
                document.getElementById('select-all').checked = false;
            }
        }

        // Exporta o ficheiro 'musicas.json' atualizado
        function exportarJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(musicas, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "musicas.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Configuração da zona de Arrastar e Soltar (Drag & Drop)
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('hover');
        });

        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');
            processarArquivos(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => processarArquivos(e.target.files));

        function processarArquivos(files) {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('audio/')) {
                    // Extrai nome limpo do arquivo para o Título
                    const nomeLimpo = file.name.replace(/\.[^/.]+$/, "").replace(/_/g, " ");
                    musicas.push({
                        titulo: nomeLimpo,
                        artista: "Artista Desconhecido",
                        genero: "Single",
                        audio: `musicas/${file.name}`,
                        capa: "capa.jpg"
                    });
                }
            });
            salvarNoLocalStorage();
            renderizarTabela();
            alert(`${files.length} ficheiro(s) processado(s) e adicionado(s) à lista!`);
        }

        carregarMusicasAdmin();
    </script>
</body>
</html>
