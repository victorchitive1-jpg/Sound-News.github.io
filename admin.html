<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound News - Gerador de JSON Admin</title>

    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #181b26;
            --primary-color: #ffffff;
            --secondary-color: #a0a5b5;
            --accent-color: #1db954;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            padding: 20px 15px 60px 15px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #25293a;
        }

        h1 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-voltar {
            background-color: #232736;
            color: var(--secondary-color);
            border: 1px solid #32374d;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn-voltar:hover {
            color: #fff;
            border-color: var(--accent-color);
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #25293a;
        }

        .card-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: var(--secondary-color);
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #32374d;
            background-color: #0f111a;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .botoes-acoes {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            font-size: 0.9rem;
        }

        .btn-adicionar {
            background-color: var(--accent-color);
            color: #000;
        }

        .btn-limpar {
            background-color: #32374d;
            color: #fff;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        /* Área do JSON */
        textarea {
            width: 100%;
            height: 280px;
            background-color: #090a10;
            color: #1db954;
            border: 1px solid #32374d;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            resize: vertical;
            outline: none;
        }

        .area-copiar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn-copiar {
            background-color: #232736;
            color: #fff;
            border: 1px solid var(--accent-color);
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn-copiar:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        /* Lista de Músicas Temporárias */
        .item-lista {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f111a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #25293a;
        }

        .btn-remover {
            background: none;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚙️ Gerador de JSON (Admin)</h1>
            <a href="index.html" class="btn-voltar">← Voltar ao App</a>
        </header>

        <!-- Formulário de Cadastro -->
        <div class="card">
            <h2 class="card-title">➕ Adicionar Nova Música</h2>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="id">ID da Música *</label>
                    <input type="number" id="id" placeholder="Ex: 1, 2, 3...">
                </div>

                <div class="form-group">
                    <label for="titulo">Título da Música *</label>
                    <input type="text" id="titulo" placeholder="Ex: Mamas Baby">
                </div>

                <div class="form-group">
                    <label for="artista">Artista / Cantor *</label>
                    <input type="text" id="artista" placeholder="Ex: Nelson Tivane">
                </div>

                <div class="form-group">
                    <label for="genero">Gênero Musical</label>
                    <input type="text" id="genero" placeholder="Ex: Amapiano, Kizomba">
                </div>

                <div class="form-group">
                    <label for="capa">Imagem da Capa</label>
                    <input type="text" id="capa" placeholder="Ex: capa.jpg">
                </div>

                <div class="form-group">
                    <label for="audio">Arquivo de Áudio (.mp3) *</label>
                    <input type="text" id="audio" placeholder="Ex: musica.mp3">
                </div>

                <div class="form-group">
                    <label for="downloadNome">Nome do Ficheiro para Download</label>
                    <input type="text" id="downloadNome" placeholder="Ex: Nelson Tivane - Mamas baby.mp3">
                </div>

                <div class="form-group">
                    <label for="downloadsIniciais">Downloads Iniciais</label>
                    <input type="number" id="downloadsIniciais" value="0">
                </div>

                <div class="form-group">
                    <label for="likesIniciais">Likes Iniciais</label>
                    <input type="number" id="likesIniciais" value="0">
                </div>
            </div>

            <div class="botoes-acoes">
                <button class="btn btn-adicionar" onclick="adicionarMusica()">➕ Adicionar à Lista</button>
                <button class="btn btn-limpar" onclick="limparTudo()">🗑️ Limpar Tudo</button>
            </div>
        </div>

        <!-- Músicas na Fila -->
        <div class="card">
            <h2 class="card-title">🎵 Músicas Adicionadas (<span id="total-count">0</span>)</h2>
            <div id="lista-preview"></div>
        </div>

        <!-- Código JSON Gerado -->
        <div class="card">
            <div class="area-copiar">
                <h2 class="card-title" style="margin-bottom: 0;">📄 Código JSON Gerado</h2>
                <button class="btn-copiar" onclick="copiarJSON()">📋 Copiar Código JSON</button>
            </div>
            <p style="color: var(--secondary-color); font-size: 0.8rem; margin-bottom: 10px;">
                Copie o conteúdo abaixo e cole dentro do seu arquivo <strong>musicas.json</strong>.
            </p>
            <textarea id="json-output" readonly></textarea>
        </div>
    </div>

    <script>
        let listaMusicas = [];
        let proximoId = 1;

        // Auto-preenche o ID inicial
        document.getElementById('id').value = proximoId;

        // Auto-preenche o campo 'downloadNome' conforme o usuário digita
        document.getElementById('artista').addEventListener('input', preencherDownloadNome);
        document.getElementById('titulo').addEventListener('input', preencherDownloadNome);

        function preencherDownloadNome() {
            const artista = document.getElementById('artista').value.trim();
            const titulo = document.getElementById('titulo').value.trim();
            const campoDownload = document.getElementById('downloadNome');
            
            // Só altera automaticamente se o usuário não tiver escrito algo manualmente diferente
            if (artista && titulo) {
                campoDownload.value = `${artista} - ${titulo}.mp3`;
            }
        }

        function adicionarMusica() {
            const idInput = document.getElementById('id').value;
            const titulo = document.getElementById('titulo').value.trim();
            const artista = document.getElementById('artista').value.trim();
            const genero = document.getElementById('genero').value.trim();
            let capa = document.getElementById('capa').value.trim();
            const audio = document.getElementById('audio').value.trim();
            let downloadNome = document.getElementById('downloadNome').value.trim();
            const downloadsIniciais = parseInt(document.getElementById('downloadsIniciais').value) || 0;
            const likesIniciais = parseInt(document.getElementById('likesIniciais').value) || 0;

            if (!idInput || !titulo || !artista || !audio) {
                alert("Por favor, preencha os campos obrigatórios: ID, Título, Artista e Arquivo de Áudio!");
                return;
            }

            if (!capa) capa = 'capa.jpg';
            if (!downloadNome) downloadNome = `${artista} - ${titulo}.mp3`;

            const novaMusica = {
                id: parseInt(idInput),
                titulo: titulo,
                artista: artista,
                genero: genero || 'Single',
                capa: capa,
                audio: audio,
                downloadNome: downloadNome,
                downloadsIniciais: downloadsIniciais,
                likesIniciais: likesIniciais
            };

            listaMusicas.push(novaMusica);
            
            // Incrementa sugestão do próximo ID
            proximoId = parseInt(idInput) + 1;

            atualizarTela();
            limparFormulario();
        }

        function removerMusica(index) {
            listaMusicas.splice(index, 1);
            atualizarTela();
        }

        function limparTudo() {
            if (confirm("Deseja realmente limpar toda a lista?")) {
                listaMusicas = [];
                proximoId = 1;
                atualizarTela();
                document.getElementById('id').value = proximoId;
            }
        }

        function limparFormulario() {
            document.getElementById('id').value = proximoId;
            document.getElementById('titulo').value = '';
            document.getElementById('artista').value = '';
            document.getElementById('genero').value = '';
            document.getElementById('capa').value = '';
            document.getElementById('audio').value = '';
            document.getElementById('downloadNome').value = '';
            document.getElementById('downloadsIniciais').value = '0';
            document.getElementById('likesIniciais').value = '0';
        }

        function atualizarTela() {
            document.getElementById('total-count').innerText = listaMusicas.length;

            const preview = document.getElementById('lista-preview');
            preview.innerHTML = '';

            if (listaMusicas.length === 0) {
                preview.innerHTML = '<p style="color: var(--secondary-color); font-size: 0.85rem;">Nenhuma música adicionada ainda.</p>';
            } else {
                listaMusicas.forEach((m, i) => {
                    const item = document.createElement('div');
                    item.className = 'item-lista';
                    item.innerHTML = `
                        <div>
                            <strong>#${m.id} - ${m.titulo}</strong> (${m.artista}) 
                            <span style="color: var(--accent-color); font-size: 0.8rem;">[${m.genero}]</span>
                        </div>
                        <button class="btn-remover" onclick="removerMusica(${i})" title="Remover">❌</button>
                    `;
                    preview.appendChild(item);
                });
            }

            // Exibe o JSON perfeitamente formatado
            document.getElementById('json-output').value = JSON.stringify(listaMusicas, null, 4);
        }

        function copiarJSON() {
            const jsonTextarea = document.getElementById('json-output');

            if (!jsonTextarea.value || jsonTextarea.value === "[]") {
                alert("Não há código JSON para copiar. Adicione pelo menos uma música.");
                return;
            }

            jsonTextarea.select();
            jsonTextarea.setSelectionRange(0, 99999);

            navigator.clipboard.writeText(jsonTextarea.value).then(() => {
                alert("Código JSON copiado com sucesso! Cole no arquivo musicas.json");
            }).catch(err => {
                alert("Erro ao copiar automaticamente. Selecione o texto e copie com Ctrl+C.");
            });
        }

        atualizarTela();
    </script>
</body>
</html>
